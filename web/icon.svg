<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="MNTD LoRa Repeater">
  <title>MNTD LoRa Repeater</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="0.5" stop-color="#d9ad45"/>
      <stop offset="1" stop-color="#a87b1f"/>
    </linearGradient>
  </defs>
  <!-- radio waves -->
  <path d="M45 15a8 8 0 0 1 8 0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
  <path d="M41.5 10a15 15 0 0 1 15 0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- antenna -->
  <rect x="47" y="19" width="4" height="15" rx="2" fill="#2b2b2b"/>
  <!-- extruded gold case: wide, flat, square-ish corners -->
  <rect x="3" y="32" width="58" height="22" rx="2.5" fill="url(#gold)" stroke="#8a6416" stroke-width="1.5"/>
  <!-- horizontal ribs of the extrusion, full width -->
  <path d="M4.5 36.5h55M4.5 40.5h55M4.5 44.5h55M4.5 48.5h55" stroke="#9c7019" stroke-width="1.3" opacity=".7"/>
  <path d="M4.5 37.6h55M4.5 41.6h55M4.5 45.6h55M4.5 49.6h55" stroke="#fbe7a8" stroke-width=".7" opacity=".6"/>
</svg>
