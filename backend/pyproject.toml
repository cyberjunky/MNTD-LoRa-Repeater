[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lorarepeater"
version = "0.1.0"
description = "LoRaWAN + Meshtastic repeater backend, logger and web GUI for the MNTD Goldspot (Raspberry Pi 4 + RAK2287)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cyberjunky" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mesh = ["meshtastic>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
lorarepeater = "lorarepeater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lorarepeater"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]   # long lines in SQL strings and tables are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
