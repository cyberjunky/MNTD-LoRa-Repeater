# lorarepeater configuration (/etc/lorarepeater/config.yaml)
db_path: __DATA_DIR__/lorarepeater.db
retention_days: 90

gwmp:
  # Where lora_pkt_fwd sends its traffic (matches global_conf.json server_address/ports)
  listen_host: 127.0.0.1
  listen_port: 1730
  # Leave empty to use the EUI the forwarder reports
  gateway_eui: ""
  pull_interval_s: 10
  # LoRaWAN network servers to fan out to. All receive every uplink; the first to answer
  # a downlink slot wins. Set rx_only: true to log but never transmit for that network.
  upstreams:
    - name: helium           # helium_gateway (gateway-rs) on this box, key in the ATECC608
      host: 127.0.0.1
      port: 1680
  #  - name: chirpstack
  #    host: 192.168.1.10
  #    port: 1700
  #  - name: ttn
  #    host: eu1.cloud.thethings.network
  #    port: 1700

# Meshtastic on the RAK2287 itself (patched sx1302_hal, service channel at 869.525 MHz).
# This is the default: one radio, one antenna. The box is a real Meshtastic node.
meshsx:
  enabled: true           # false = LoRaWAN only
  freq_mhz: 869.525
  datr: SF11BW250         # EU_868 LongFast
  codr: 4/5
  tx_enabled: true
  tx_power_dbm: 14
  node_num: null          # null = derived from the Pi serial number
  long_name: MNTD Repeater
  short_name: MNTD
  role: ROUTER_LATE       # ROUTER_LATE indoors, ROUTER on an elevated site, CLIENT_MUTE = listen only
  hop_limit: 3
  duty_cycle_pct: 10      # EU 869.4-869.65 MHz band
  nodeinfo_interval_s: 3600
  position_broadcast: false   # true = announce the site position below (coarsened to precision_bits)
  position_precision_bits: 16
  # position: {lat: 52.0, lon: 5.0, alt: 10}   # site position (there is no GPS on this hardware)
  channels:
    - name: LongFast
      psk: "AQ=="           # default key; own key in base64: 16 bytes = AES-128, 32 bytes = AES-256

# Telegram bot: mesh texts into a chat, /send and /dm out. Create a bot with @BotFather.
telegram:
  enabled: false
  token: ""
  allowed_chat_ids: []      # the bot tells you the id of any chat that talks to it (see events)
  notify_chat_id: null      # chat or channel id that receives every mesh text
  notify_all_text: true

# MQTT (also editable in the GUI's Settings tab; what is saved there wins over this file)
mqtt:
  meshtastic:               # uplink like a Meshtastic node with MQTT on (encrypted ServiceEnvelope)
    enabled: false
    host: mqtt.meshtastic.org
    port: 1883
    username: meshdev
    password: large4cats
    tls: false
    root_topic: msh/EU_868
    channels: [LongFast]    # names from meshsx.channels
  homeassistant:            # discovery, gateway and node sensors, texts in and out
    enabled: false
    host: ""                # the broker Home Assistant uses
    port: 1883
    username: ""
    password: ""
    tls: false
    base_topic: lorarepeater
    discovery_prefix: homeassistant
    node_entities: true     # a device per heard node
    allow_send: true        # texts on lorarepeater/send go to the mesh

web:
  host: 0.0.0.0
  port: 8080
  title: MNTD LoRa Repeater
  # dir: /opt/lorarepeater/web   # GUI files; default looks there, then in the repo checkout

hardware:
  led_enabled: true       # health on the Pi ACT/PWR LEDs behind the front light pipes
