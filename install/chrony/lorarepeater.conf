# chrony: use the RAK2287 GPS (via gpsd shared memory) as a time reference.
# Without a kernel PPS line the NMEA/UBX time is good to a few tens of milliseconds, which is
# plenty for a LAN NTP server; internet pool servers remain configured as fallback.
refclock SHM 0 refid GPS precision 1e-3 offset 0.0 delay 0.2 poll 4
# Serve time to the local network (adjust to your subnet)
allow 192.168.0.0/16
allow 10.0.0.0/8
local stratum 10
