# Fallback copy of the meshtasticd preset for the Elecrow MeshStick (CH341 USB-SPI + SX1262).
# The package ships the same file under /etc/meshtasticd/available.d/; this one is used only
# if that is missing. Verify against upstream before relying on it.
Lora:
  Module: sx1262
  spidev: ch341
  USB_VID: 0x1A86
  USB_PID: 0x5512
  DIO2_AS_RF_SWITCH: true
  DIO3_TCXO_VOLTAGE: true
  CS: 0
  IRQ: 1
  Busy: 2
  Reset: 3
